name: Remote Control - validation and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg installed for media tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Discovery, encrypted pairing, MJPEG and H.264 transport tests
        run: node --test tools/lan_probe/*.test.mjs tools/stream_lab/*.test.mjs tools/video_lab/*.test.mjs
  android-debug-apk:
    runs-on: ubuntu-latest
    needs: node-protocol-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter scaffold, analyzer and widget tests
        run: ./scripts/bootstrap_flutter.sh
      - name: Build Debug APK (UI/LAN lab, NOT remote-control product)
        working-directory: app
        run: flutter build apk --debug
      - name: Upload real build output only if successful
        uses: actions/upload-artifact@v4
        with:
          name: liquid-fusion-v0_8-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  windows-debug-bundle:
    runs-on: windows-latest
    needs: node-protocol-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter scaffold and analyzer
        shell: pwsh
        run: ./scripts/bootstrap_flutter.ps1
      - name: Flutter widget tests
        shell: pwsh
        working-directory: app
        run: flutter test
      - name: Build Windows Debug bundle
        shell: pwsh
        working-directory: app
        run: flutter build windows --debug
      - name: Upload full Windows app bundle
        uses: actions/upload-artifact@v4
        with:
          name: liquid-fusion-v0_8-windows-debug
          path: app/build/windows/x64/runner/Debug/
          if-no-files-found: error
