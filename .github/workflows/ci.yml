name: Remote Control - validation and build
on:
  push:
    # Temporary milestone branch gate: PR #1 has base conflicts, so GitHub
    # suppresses pull_request checks. This validates the head WITHOUT merging main.
    branches: [main, feature/build-reliability-v0_9]
  pull_request:
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'Explicit final-build approval after all source acceptance gates pass'
        required: true
        type: boolean
        default: false
      media_lab_approved:
        description: 'Optional FFmpeg encode/decode integration run; never creates APK or EXE'
        required: false
        type: boolean
        default: false
      saf_milestone_approved:
        description: 'Explicit native SAF integration recheck (Debug APK only; not a release)'
        required: false
        type: boolean
        default: false

# Avoid spending runner time on obsolete revisions while preserving explicit artifacts.
concurrency:
  group: remote-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate artifact verifier (positive and rejection tests)
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Parse every Node LAN and media module (source only)
        run: find tools -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Fast LAN discovery and pairing tests (no media tool install)
        run: node --test tools/lan_probe/*.test.mjs
      # GitHub Ubuntu runners can take many minutes downloading ~100 MB of
      # FFmpeg dependencies. Do not block every source-only PR on apt mirrors.
      # The two real-codec integration tests self-report SKIP if FFmpeg is absent.
      - name: Install FFmpeg for explicitly requested media integration only
        if: github.event_name == 'workflow_dispatch' && inputs.media_lab_approved == true
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180s sudo apt-get update
            timeout 600s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Record FFmpeg integration coverage without claiming a pass
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFmpeg/FFprobe present: real-codec media integration tests enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT TESTED: real-codec FFmpeg integration tests self-skip on this runner. Use manual media_lab_approved dispatch to run them." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Secure streaming and video transport lab tests
        run: node --test tools/stream_lab/*.test.mjs tools/video_lab/*.test.mjs

  flutter-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter scaffold, static analyzer and widget tests (NO APK/EXE)
        run: bash ./scripts/bootstrap_flutter.sh

  # Native SAF policy regression is an opt-in source-only check; it never builds an APK/EXE.
  android-saf-policy-tests:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[saf-policy-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provide Kotlin JVM compiler
        shell: bash
        run: |
          set -euo pipefail
          if command -v kotlinc >/dev/null 2>&1; then
            kotlinc -version
          else
            curl -fL --retry 3 "https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip" -o "$RUNNER_TEMP/kotlinc.zip"
            unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          fi
      - name: Run native SAF filename and staging policy tests (no package build)
        shell: bash
        run: |
          set -euo pipefail
          kotlinc \
            android_overlay/app/src/main/kotlin/com/example/liquid_remote_control/SafReceivePolicy.kt \
            qa/SafReceivePolicyTest.kt -include-runtime -d "$RUNNER_TEMP/saf-policy.jar"
          java -jar "$RUNNER_TEMP/saf-policy.jar"
          kotlinc \
            android_overlay/app/src/main/kotlin/com/example/liquid_remote_control/IdleStageLease.kt \
            qa/IdleStageLeaseTest.kt -include-runtime -d "$RUNNER_TEMP/stage-lease.jar"
          java -jar "$RUNNER_TEMP/stage-lease.jar"

# Explicit opt-in milestone recheck only: avoid rebuilding APK on each source push.
  # M8 passed on 036d16c2; this is NOT device acceptance.
  android-saf-milestone-build:
    # A single explicit commit marker enables the M34 native-SAF rollback compile check.
    # Ordinary pushes remain source-only; this is not a recurring APK build.
    if: (github.event_name == 'workflow_dispatch' && inputs.saf_milestone_approved == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[m34-platform-compile]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: flutter-source-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter with versioned native Android SAF overlay
        run: bash ./scripts/bootstrap_flutter.sh
      - name: Regress native SAF filename, Unicode and staging quota policy
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v kotlinc >/dev/null 2>&1; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotlinc.zip" \
              https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
            unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/kotlinc/bin:$PATH"
          fi
          kotlinc \
            android_overlay/app/src/main/kotlin/com/example/liquid_remote_control/SafReceivePolicy.kt \
            qa/SafReceivePolicyTest.kt -include-runtime -d "$RUNNER_TEMP/saf-policy.jar"
          java -jar "$RUNNER_TEMP/saf-policy.jar"
          kotlinc \
            android_overlay/app/src/main/kotlin/com/example/liquid_remote_control/IdleStageLease.kt \
            qa/IdleStageLeaseTest.kt -include-runtime -d "$RUNNER_TEMP/stage-lease.jar"
          java -jar "$RUNNER_TEMP/stage-lease.jar"
      - name: Compile real Android debug APK with Kotlin SAF bridge
        working-directory: app
        run: flutter build apk --debug
      - name: Validate APK structure and record SHA-256
        run: python scripts/verify_build_artifact.py --apk app/build/app/outputs/flutter-apk/app-debug.apk --out app/build-evidence/android-saf.json
      - name: Upload milestone APK and verification evidence (not device acceptance)
        uses: actions/upload-artifact@v4
        with:
          name: remote-android-saf-milestone-debug
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build-evidence/android-saf.json
          if-no-files-found: error
          retention-days: 7

  android-debug-apk:
    # One-off Android device-test package is allowed only with the explicit commit marker.
    if: (github.event_name == 'workflow_dispatch' && inputs.release_approved == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[device-test-build]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: node-protocol-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter scaffold, analyzer and widget tests
        run: bash ./scripts/bootstrap_flutter.sh
      - name: Produce real Android Debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Verify structure, size and SHA-256; write evidence
        run: |
          python scripts/verify_build_artifact.py \
            --apk app/build/app/outputs/flutter-apk/app-debug.apk \
            --out app/build-evidence/android.json
      - name: Upload verified Android binary and evidence
        uses: actions/upload-artifact@v4
        with:
          name: liquid-fusion-android-debug-verified
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build-evidence/android.json
          if-no-files-found: error
          retention-days: 14

  windows-debug-bundle:
    # Windows-only staging/path safety acceptance bundle; ordinary pushes stay source-only.
    # The generic [device-test-build] marker is reserved for both-platform acceptance.
    if: (github.event_name == 'workflow_dispatch' && inputs.release_approved == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[m34-platform-compile]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[device-test-build]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-device-test-build]'))
    runs-on: windows-latest
    timeout-minutes: 60
    needs: node-protocol-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter scaffold and analyzer
        shell: pwsh
        run: ./scripts/bootstrap_flutter.ps1
      - name: Flutter widget tests
        shell: pwsh
        working-directory: app
        run: flutter test
      - name: Produce real Windows debug application
        shell: pwsh
        working-directory: app
        run: flutter build windows --debug
      - name: Verify full bundle, PE executable, SHA-256 and assets
        shell: pwsh
        run: |
          python scripts/verify_build_artifact.py `
            --windows app/build/windows/x64/runner/Debug `
            --out app/build-evidence/windows.json
      - name: Upload verified Windows bundle and evidence
        uses: actions/upload-artifact@v4
        with:
          name: liquid-fusion-windows-debug-verified
          path: |
            app/build/windows/x64/runner/Debug/
            app/build-evidence/windows.json
          if-no-files-found: error
          retention-days: 14

  # Process-lifecycle contract is platform-sensitive even when the unit test uses a fake child.
  # Run it on Windows without producing a Windows bundle or requiring FFmpeg.
  windows-capture-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test graceful exit, force-stop escalation and cleanup on Windows Node
        run: node --test tools/stream_lab/child_lifecycle.test.mjs
      - name: Parse integrated capture modules
        run: node --check tools/stream_lab/preview_stream.mjs && node --check tools/video_lab/h264_transport.mjs
